name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: ["completed"]
    branches: [master]

# Never run two releases at once: they would race to tag and publish the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Only a push to master of this repo. A fork PR from its own `master` branch also
    # reports head_branch == 'master' and must not release.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      # Release only code whose CI passed. master may be ahead of the tested commit, but
      # only by commits that touch nothing CI watches (docs, for example), because those
      # start no CI run of their own. A release commit on top (a re-run after a failed
      # publish) is ignored too. Keep the paths in sync with ci.yml.
      - name: Check master is the tested commit
        id: tip
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          BASE=HEAD
          if git log -1 --format=%s HEAD | grep -q '^chore(release): '; then BASE=HEAD~1; fi
          if git merge-base --is-ancestor "$TESTED_SHA" "$BASE" \
             && git diff --quiet "$TESTED_SHA" "$BASE" -- package.json package-lock.json tsconfig.json tsconfig.build.json vitest.config.ts src test .github; then
            echo "current=true" >> $GITHUB_OUTPUT
          else
            echo "master has untested changes past $TESTED_SHA; skipping, their CI run will release"
            echo "current=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v4
        if: steps.tip.outputs.current == 'true'
        with:
          node-version: 22
          cache: 'npm'

      - if: steps.tip.outputs.current == 'true'
        run: npm ci
      - if: steps.tip.outputs.current == 'true'
        run: npm run build

      - name: Set up Git author
        if: steps.tip.outputs.current == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      # No `|| true`: if release-it fails after bumping, nothing must be published.
      # "No commits since the last tag" exits 0 (git.requireCommitsFail is false).
      - name: Run release-it
        if: steps.tip.outputs.current == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release -- --ci

      # Publish whenever package.json's version is not on npm yet, not only when this run
      # bumped it. If a publish failed after release-it pushed the tag, a re-run recovers.
      - name: Check if the version is on npm
        if: steps.tip.outputs.current == 'true'
        id: npm
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm"
            echo "publish=false" >> $GITHUB_OUTPUT
          else
            echo "$NAME@$VERSION is not on npm yet"
            echo "publish=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: steps.tip.outputs.current == 'true' && steps.npm.outputs.publish == 'true'
        run: npx --yes npm@latest publish --access public --provenance
