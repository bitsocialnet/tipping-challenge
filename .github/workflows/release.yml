name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: ["completed"]
    branches: [master]

# Never run two releases at once: they would race to tag and publish the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Only a push to master of this repo. A fork PR from its own `master` branch also
    # reports head_branch == 'master' and must not release.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      # Release only code whose CI passed. master may be ahead of the tested commit, but
      # only by commits that touch nothing but the files ci.yml ignores (docs), because
      # those start no CI run of their own. Every other path counts as a release input,
      # so an unlisted file such as .npmrc cannot slip in. Commits generated by this
      # workflow (verified by author, subject and the files they touch) are ignored too,
      # so a re-run after a failed publish still works. Keep the ignore list in sync
      # with `paths-ignore` in ci.yml.
      - name: Check master is the tested commit
        id: tip
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          is_release_commit() {
            [ "$(git log -1 --format=%ae "$1")" = "github-actions[bot]@users.noreply.github.com" ] || return 1
            git log -1 --format=%s "$1" | grep -q '^chore(release): ' || return 1
            ! git diff --name-only "$1^1" "$1" | grep -qvx -e CHANGELOG.md -e package.json -e package-lock.json
          }
          ok=true
          git merge-base --is-ancestor "$TESTED_SHA" HEAD || ok=false
          for c in $(git rev-list "$TESTED_SHA..HEAD"); do
            is_release_commit "$c" && continue
            if [ -n "$(git diff --name-only "$c^1" "$c" -- . ':(exclude)README.md' ':(exclude)AGENTS.md' ':(exclude)CLAUDE.md' ':(exclude)LICENSE' ':(exclude).gitignore' ':(exclude)CHANGELOG.md')" ]; then ok=false; fi
          done
          if [ "$ok" = true ]; then
            echo "current=true" >> $GITHUB_OUTPUT
          else
            echo "master has untested changes past $TESTED_SHA; skipping, their CI run will release"
            echo "current=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v4
        if: steps.tip.outputs.current == 'true'
        with:
          node-version: 22
          cache: 'npm'

      # Same npm as ci.yml: the lockfile is written by npm 11, and the npm 10 that ships
      # with Node 22 rejects it ("Missing: utf-8-validate from lock file").
      - if: steps.tip.outputs.current == 'true'
        run: npm install -g npm@11
      - if: steps.tip.outputs.current == 'true'
        run: npm ci
      - if: steps.tip.outputs.current == 'true'
        run: npm run build

      - name: Set up Git author
        if: steps.tip.outputs.current == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      # release-it bumps a patch for any commit, even test: or ci:. Only release when a
      # commit since the last tag is releasable: feat, fix, perf, revert (including git's `Revert "..."`) or breaking (`type!:` or a footer).
      - name: Check for releasable commits
        if: steps.tip.outputs.current == 'true'
        id: commits
        run: |
          LAST=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || true)
          RANGE="${LAST:+$LAST..}HEAD"
          # Judge the header (subject) and a real `BREAKING CHANGE:` footer only. A
          # free-form body line such as "fix: example" must not make a docs: commit releasable.
          if git log "$RANGE" --format=%s | grep -Eq '^([a-z]+(\([^)]*\))?!:|(feat|fix|perf|revert)(\([^)]*\))?:|Revert ")' \
             || git log "$RANGE" --format=%b | grep -Eq '^BREAKING[ -]CHANGE: '; then
            echo "releasable=true" >> $GITHUB_OUTPUT
          else
            echo "No feat, fix, perf, revert or breaking commit since ${LAST:-the start}"
            echo "releasable=false" >> $GITHUB_OUTPUT
          fi

      # No `|| true`: if release-it fails after bumping, nothing must be published.
      # "No commits since the last tag" exits 0 (git.requireCommitsFail is false).
      - name: Run release-it
        if: steps.tip.outputs.current == 'true' && steps.commits.outputs.releasable == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release -- --ci

      # If release-it pushed the tag but creating the GitHub release failed, a re-run
      # finds no new commits, so create the missing release here.
      - name: Ensure the GitHub release exists
        if: steps.tip.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
             && ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --verify-tag --generate-notes
          fi

      # Publish whenever package.json's version is not on npm yet, not only when this run
      # bumped it. If a publish failed after release-it pushed the tag, a re-run recovers.
      - name: Check if the version is on npm
        if: steps.tip.outputs.current == 'true'
        id: npm
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm"
            echo "publish=false" >> $GITHUB_OUTPUT
          else
            echo "$NAME@$VERSION is not on npm yet"
            echo "publish=true" >> $GITHUB_OUTPUT
          fi

      # A recovery publish (release-it did not run, but the tag already exists) must ship
      # the tagged source, not whatever master holds now.
      - name: Build the tagged source for a recovery publish
        if: >-
          steps.tip.outputs.current == 'true' && steps.npm.outputs.publish == 'true'
          && steps.commits.outputs.releasable != 'true'
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git checkout --detach "$TAG"
            npm ci
            npm run build
          fi

      - name: Publish to npm
        if: steps.tip.outputs.current == 'true' && steps.npm.outputs.publish == 'true'
        run: npx --yes npm@latest publish --access public --provenance
